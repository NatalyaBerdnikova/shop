name: static-site

on:
  push:
  pull_request:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node -v
      - run: npm -v
      - run: npm ci
      - run: npm run test:unit -- --coverage.enabled=false
      - run: npm run generate
      - run: npm run verify:static
